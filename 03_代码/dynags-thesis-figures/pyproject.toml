[project]
name = "dynags-thesis-figures"
version = "0.1.0"
description = "Reproducible scientific figures for the DynaGS thesis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "pycirclize>=1.10",
    "pyreadr>=0.5",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynags_figures"]

[tool.ruff]
line-length = 100
target-version = "py311"

